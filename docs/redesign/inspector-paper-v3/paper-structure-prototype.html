<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inspector Paper V3 — physical-paper study</title>
    <style>
      :root {
        --desk: #ded7c8;
        --paper: #f5f0e5;
        --ink: #181818;
        --rule: rgba(77, 106, 161, 0.15);
        --blue: #1d51d5;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 15%, rgba(255,255,255,.55), transparent 26%),
          linear-gradient(115deg, #e7e0d2, var(--desk));
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      }

      .board {
        position: relative;
        display: grid;
        grid-template-columns: minmax(360px, 1fr) 440px;
        width: min(1180px, calc(100vw - 48px));
        min-height: 710px;
        overflow: hidden;
        border: 3px solid var(--ink);
        border-radius: 8px;
        background: #eee9de;
        box-shadow: 0 18px 44px rgba(52, 42, 27, .23);
      }

      .context {
        padding: 44px;
        border-right: 2px solid rgba(24,24,24,.8);
        background:
          repeating-linear-gradient(0deg, transparent 0 48px, rgba(0,0,0,.035) 49px 50px),
          linear-gradient(135deg, #faf8f2, #ebe4d8);
      }
      .context small { letter-spacing: .14em; font-weight: 800; }
      .context h1 { margin: 12px 0 6px; font-size: clamp(30px, 4vw, 52px); letter-spacing: -.06em; }
      .context p { max-width: 420px; line-height: 1.8; color: #4d4941; }
      .ghost-cards { display: grid; grid-template-columns: repeat(2, minmax(110px, 1fr)); gap: 14px; margin-top: 42px; }
      .ghost-card { height: 126px; border: 2px solid var(--ink); border-radius: 4px; background: #fffdf8; box-shadow: 3px 3px 0 rgba(0,0,0,.08); }
      .ghost-card:nth-child(2) { background: #dce7ff; }
      .ghost-card:nth-child(3) { background: #ffe065; }
      .ghost-card:nth-child(4) { background: #d9f0d4; }

      .inspector-stage {
        position: relative;
        min-height: 710px;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(81,66,39,.1), transparent 16%),
          repeating-linear-gradient(0deg, transparent 0 33px, rgba(93,77,47,.035) 34px 35px),
          #e3dccf;
      }
      .inspector-label {
        position: absolute;
        top: 20px;
        right: 26px;
        z-index: 5;
        font-size: 11px;
        letter-spacing: .12em;
        opacity: .56;
      }

      /* The whole physical assembly rotates together. Content remains normal DOM. */
      .paper-assembly {
        position: absolute;
        top: 25px;
        left: 30px;
        width: 388px;
        height: 680px;
        transform: perspective(1200px) rotateZ(-.72deg) rotateY(-.55deg);
        transform-origin: 18% 2%;
      }

      /* Rings are a separate, rear layer: never painted as circles on the paper face. */
      .rings {
        position: absolute;
        z-index: 1;
        top: 15px;
        left: -23px;
        width: 60px;
        height: 645px;
        overflow: visible;
        filter: drop-shadow(1px 2px 0 rgba(255,255,255,.55));
      }
      .rings path {
        fill: #f0eadf;
        stroke: #171717;
        stroke-width: 2.3;
        stroke-linejoin: round;
      }

      .paper {
        position: absolute;
        z-index: 2;
        inset: 0 0 0 11px;
        overflow: hidden;
        border: 2px solid var(--ink);
        border-radius: 5px 8px 4px 3px;
        background-color: var(--paper);
        background-image:
          linear-gradient(90deg, rgba(255,255,255,.28), transparent 20%, rgba(122,95,55,.055)),
          url("../playful-handdrawn/paper-texture-512.png"),
          repeating-linear-gradient(0deg, transparent 0 31px, var(--rule) 32px 33px);
        background-size: auto, 256px 256px, auto;
        box-shadow:
          inset 5px 0 9px rgba(105, 83, 43, .065),
          inset 0 -6px 9px rgba(100, 75, 35, .09),
          3px 3px 0 rgba(24,24,24,.22),
          12px 18px 24px rgba(67, 53, 29, .25);
      }

      /* A mask-like cut edge: the desk shows through each punch; each has a tactile lower rim. */
      .punches {
        position: absolute;
        z-index: 4;
        top: 20px;
        left: -1px;
        width: 42px;
        height: 628px;
        overflow: visible;
      }
      .punches circle { fill: #e3dccf; stroke: #191919; stroke-width: 1.5; }
      .punches path { fill: none; stroke: rgba(87,65,29,.35); stroke-width: 2; stroke-linecap: round; }

      .paper-content {
        position: relative;
        height: 100%;
        padding: 30px 24px 34px 49px;
      }
      .paper-content::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 39px;
        width: 1px;
        background: rgba(208, 68, 56, .25);
      }
      .paper h2 { margin: 0 0 17px; font-size: 22px; letter-spacing: -.04em; }
      .section { position: relative; margin-top: 17px; }
      .section h3 { margin: 0 0 7px; font-size: 13px; }
      .thumb {
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        min-height: 130px;
        overflow: hidden;
        border: 2px solid var(--ink);
        border-radius: 3px;
        background: #f7f8ff;
        box-shadow: 2px 2px 0 rgba(0,0,0,.12);
      }
      .thumb-copy { padding: 14px 9px 10px 13px; font-size: 9px; line-height: 1.25; }
      .thumb-copy b { display: block; margin-top: 28px; font-size: 20px; line-height: .95; letter-spacing: -.09em; }
      .orb { position: relative; overflow: hidden; background: radial-gradient(circle at 45% 54%, #6e54ff 0 4%, #a096ff 20%, #e8e5ff 56%, #f7f7fb 69%); }
      .orb::after { content: ""; position: absolute; width: 92px; height: 92px; top: 25px; left: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 40%, rgba(68,39,245,.96), rgba(154,115,255,.65) 33%, rgba(238,230,255,0) 70%); filter: blur(4px); }
      .swatches { display: flex; gap: 8px; }
      .swatches i { width: 25px; height: 25px; border-radius: 48% 52% 53% 47%; transform: rotate(-8deg); background: var(--swatch); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chips span { padding: 3px 8px; border: 1.5px solid #4b7654; border-radius: 6px; background: rgba(255,255,255,.48); font-size: 11px; }
      .rule-copy { margin: 0; font-size: 12px; line-height: 1.75; }
      .prompt { margin-top: 12px; padding: 10px 11px; border: 1.5px solid var(--ink); border-radius: 4px; background: rgba(255,255,255,.44); font-size: 11px; line-height: 1.65; }

      .paperclip {
        position: absolute;
        z-index: 6;
        top: -6px;
        right: 4px;
        width: 36px;
        height: 76px;
        transform: rotate(-12deg);
        filter: drop-shadow(1px 2px 0 rgba(72,54,26,.18));
      }
      .paperclip path { fill: none; stroke: #191919; stroke-width: 3.1; stroke-linecap: round; stroke-linejoin: round; }

      .note { position: absolute; z-index: 7; right: 13px; bottom: 18px; transform: rotate(2deg); color: var(--blue); font-weight: 800; font-size: 12px; }
      .note::after { content: ""; display: block; width: 65px; margin-top: 4px; border-bottom: 2px solid currentColor; transform: rotate(-5deg); }

      @media (max-width: 760px) {
        body { display: block; padding: 16px; }
        .board { display: block; width: 100%; min-height: 700px; }
        .context { display: none; }
        .inspector-stage { min-height: 700px; }
        .paper-assembly { left: calc(50% - 194px); }
      }
    </style>
  </head>
  <body>
    <main class="board" aria-label="Right inspector paper study">
      <section class="context" aria-hidden="true">
        <small>STYLEBASE / VISUAL INDEX</small>
        <h1>素材库</h1>
        <p>左侧内容保持安静；右侧是一张真正从桌面上浮起、被活页环穿过的分析页。</p>
        <div class="ghost-cards"><div class="ghost-card"></div><div class="ghost-card"></div><div class="ghost-card"></div><div class="ghost-card"></div></div>
      </section>

      <aside class="inspector-stage" aria-label="资产分析检查器的纸页方案">
        <span class="inspector-label">PAPER CHASSIS STUDY / V3</span>
        <div class="paper-assembly">
          <svg class="rings" viewBox="0 0 60 645" aria-hidden="true">
            <path d="M39 11 C12 8 10 34 31 36 L46 36 L46 25 L31 25 C25 25 25 17 32 17 L42 17" />
            <path d="M39 91 C12 88 10 114 31 116 L46 116 L46 105 L31 105 C25 105 25 97 32 97 L42 97" />
            <path d="M39 171 C12 168 10 194 31 196 L46 196 L46 185 L31 185 C25 185 25 177 32 177 L42 177" />
            <path d="M39 251 C12 248 10 274 31 276 L46 276 L46 265 L31 265 C25 265 25 257 32 257 L42 257" />
            <path d="M39 331 C12 328 10 354 31 356 L46 356 L46 345 L31 345 C25 345 25 337 32 337 L42 337" />
            <path d="M39 411 C12 408 10 434 31 436 L46 436 L46 425 L31 425 C25 425 25 417 32 417 L42 417" />
            <path d="M39 491 C12 488 10 514 31 516 L46 516 L46 505 L31 505 C25 505 25 497 32 497 L42 497" />
            <path d="M39 571 C12 568 10 594 31 596 L46 596 L46 585 L31 585 C25 585 25 577 32 577 L42 577" />
          </svg>

          <article class="paper">
            <svg class="punches" viewBox="0 0 42 628" aria-hidden="true">
              <g>
                <circle cx="9" cy="17" r="10"/><path d="M3 23 Q10 28 16 23"/>
                <circle cx="9" cy="97" r="10"/><path d="M3 103 Q10 108 16 103"/>
                <circle cx="9" cy="177" r="10"/><path d="M3 183 Q10 188 16 183"/>
                <circle cx="9" cy="257" r="10"/><path d="M3 263 Q10 268 16 263"/>
                <circle cx="9" cy="337" r="10"/><path d="M3 343 Q10 348 16 343"/>
                <circle cx="9" cy="417" r="10"/><path d="M3 423 Q10 428 16 423"/>
                <circle cx="9" cy="497" r="10"/><path d="M3 503 Q10 508 16 503"/>
                <circle cx="9" cy="577" r="10"/><path d="M3 583 Q10 588 16 583"/>
              </g>
            </svg>
            <div class="paper-content">
              <h2>资产资讯</h2>
              <div class="thumb"><div class="thumb-copy">Chapter<br>Studio<b>Humanizing<br>technology</b></div><div class="orb"></div></div>
              <section class="section"><h3>视觉 DNA</h3><div class="swatches"><i style="--swatch:#6752be"></i><i style="--swatch:#1558df"></i><i style="--swatch:#8494ed"></i><i style="--swatch:#f39aad"></i><i style="--swatch:#efd899"></i><i style="--swatch:#a8aaa9"></i></div></section>
              <section class="section"><h3>标签</h3><div class="chips"><span>科技</span><span>极简</span><span>渐层</span><span>网站设计</span></div></section>
              <section class="section"><h3>备注</h3><p class="rule-copy">柔和渐层 + 大量留白，传达信任与未来感。适合科技、SaaS 品牌参考。</p></section>
              <div class="prompt">极简科技网站设计，柔和的紫蓝渐层球体，大量留白，干净排版，现代感。</div>
            </div>
          </article>
          <svg class="paperclip" viewBox="0 0 36 76" aria-hidden="true"><path d="M27 8 L17 62 C15 72 2 69 4 59 L14 14 C16 4 30 6 29 17 L20 55"/></svg>
          <span class="note">纸页不是背景图</span>
        </div>
      </aside>
    </main>
  </body>
</html>
